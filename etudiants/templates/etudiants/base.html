<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Gestion des étudiants{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
      body {
        background-color: #f4f6f9;
      }

      .navbar {
        background-color: #17365d;
      }

      .page-container {
        max-width: 1100px;
      }

      .card {
        border: none;
        border-radius: 12px;
        box-shadow: 0 3px 15px rgba(0, 0, 0, 0.06);
      }

      .table th {
        background-color: #edf2f7;
      }

      .btn-primary {
        background-color: #17365d;
        border-color: #17365d;
      }

      .btn-primary:hover {
        background-color: #102744;
        border-color: #102744;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container page-container">
        <a class="navbar-brand fw-bold" href="{% url 'liste_etudiants' %}"> Gestion des étudiants </a>

        <div class="ms-auto d-flex gap-2">
          <a href="{% url 'liste_etudiants' %}" class="btn btn-outline-light btn-sm"> Liste </a>

          <a href="{% url 'etudiant_create' %}" class="btn btn-light btn-sm"> Ajouter un étudiant </a>
        </div>
      </div>
    </nav>

    <main class="container page-container py-5">{% block content %} {% endblock %}</main>

    <footer class="text-center text-secondary py-4">
      <small> Projet 2, Programmation Web II | Gestion des étudiants avec Django </small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
